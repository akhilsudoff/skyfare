x-app-env: &app-env
  DB_URL: jdbc:postgresql://db:5432/skyfare
  DB_USER: skyfare
  DB_PASSWORD: skyfare
  JWT_SECRET: local-dev-only-secret-change-me-please-32
  AWS_REGION: ap-southeast-2
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT: http://localstack:4566
  AWS_CREATE_RESOURCES: "true"
  POLL_INTERVAL_MS: "60000"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyfare
      POSTGRES_USER: skyfare
      POSTGRES_PASSWORD: skyfare
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyfare"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: dynamodb,sqs
      DEFAULT_REGION: ap-southeast-2
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  api:
    build: .
    image: skyfare:local
    depends_on:
      db: { condition: service_healthy }
      localstack: { condition: service_healthy }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: skyfare-api
    ports: ["8080:8080"]

  worker:
    image: skyfare:local
    depends_on:
      api: { condition: service_started }
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
      OTEL_SERVICE_NAME: skyfare-worker
