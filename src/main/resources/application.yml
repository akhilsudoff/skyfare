spring:
  application:
    name: skyfare
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skyfare}
    username: ${DB_USER:skyfare}
    password: ${DB_PASSWORD:skyfare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 4
server:
  port: ${PORT:8080}
skyfare:
  provider: ${FLIGHT_PROVIDER:stub}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32}
    ttl-seconds: 86400
  aws:
    region: ${AWS_REGION:ap-southeast-2}
    endpoint: ${AWS_ENDPOINT:}
    create-resources: ${AWS_CREATE_RESOURCES:false}
    dynamodb-table: ${DYNAMODB_TABLE:fare_history}
    sqs-queue: ${SQS_QUEUE:fare-events}
  poll:
    interval-ms: ${POLL_INTERVAL_MS:60000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
resilience4j:
  circuitbreaker:
    instances:
      flightProvider:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.skyfare: INFO
